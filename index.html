<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Live in｜韩语单词 1V1</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--soft:#eef2ff;--danger:#b91c1c;--ok:#166534}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Noto Sans CJK SC",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:900px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.hero{background:#111827;color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.hero h1{font-size:30px;line-height:1.15;margin:0 0 8px}.hero p{margin:0;color:#d1d5db;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px}.stat{font-size:27px;font-weight:900}.muted{color:var(--muted);font-size:12px}.progress{height:8px;background:#edf0f3;border-radius:99px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:#111827;border-radius:99px}.nav{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);width:min(860px,calc(100% - 20px));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 12px 40px rgba(0,0,0,.12)}.nav button{background:transparent;padding:9px 4px;border-radius:14px;color:var(--muted);font-size:11px}.nav button.active{background:#111827;color:#fff}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#111827;color:#fff;padding:12px 16px;border-radius:13px;font-weight:750}.btn.secondary{background:#fff;color:#111827;border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.word-card{min-height:420px;display:flex;flex-direction:column;justify-content:center;text-align:center}.level{font-size:12px;color:var(--muted);margin-bottom:12px}.word{font-size:46px;font-weight:900;letter-spacing:-1px}.pos{display:inline-block;margin:10px auto 2px;padding:6px 10px;border-radius:999px;background:#f3f4f6;font-size:12px;color:#4b5563}.meaning{font-size:20px;margin:10px auto;max-width:680px}.example{margin:14px auto 4px;padding:14px 16px;background:#f8fafc;border:1px solid var(--line);border-radius:15px;max-width:700px;text-align:left}.example .ko{font-size:17px;font-weight:750;line-height:1.6}.example .zh{font-size:13px;color:var(--muted);margin-top:5px}.quiz{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.option{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left}.option:active{transform:scale(.98)}.feedback{margin-top:12px;padding:11px;border-radius:14px;background:#f3f4f6}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:15px}.row .w{font-weight:850}.row .m{font-size:13px;color:var(--muted);text-align:right}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none;margin-bottom:10px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.tab{white-space:nowrap;padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:999px}.tab.active{background:#111827;color:#fff}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:600px){.app{padding:14px 12px 105px}.word{font-size:40px}.quiz{grid-template-columns:1fr}.nav{bottom:8px}}
</style></head><body><div id="app"></div><script>
let DB=null,DATA=null,view='home',level='all',session=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toISOString().slice(0,10);function load(){try{DB=JSON.parse(localStorage.getItem('livein_state')||'{}')}catch{DB={}}DB.progress??={};DB.streak??={last:null,count:0};DB.settings??={daily:10}}function save(){localStorage.setItem('livein_state',JSON.stringify(DB))}function prog(id){return DB.progress[id]??{seen:0,correct:0,wrong:0,mastery:0}}function words(){return level==='all'?DATA.words:DATA.words.filter(x=>x.level===level)}function touch(w,ok){let p=prog(w.id);p.seen++;ok?p.correct++:p.wrong++;p.mastery=Math.max(0,Math.min(5,p.mastery+(ok?1:-1)));DB.progress[w.id]=p;DB.streak.last=today();DB.streak.count++;save()}function header(){return `<div class="top"><div class="brand">Live in｜韩语单词 1V1<small>你的长期韩语词汇记忆本</small></div><button class="pill" onclick="alert('词库：Level 1 当前 122 个；后续可继续扩充。')">词库说明</button></div>`}function stats(){let a=DATA.words;return {total:a.length,known:a.filter(w=>prog(w.id).mastery>=4).length,wrong:a.filter(w=>prog(w.id).wrong>0).length}}function render(){let h=view==='home'?home():view==='learn'?learn():view==='review'?review():library();$('#app').innerHTML=h+nav()}function home(){let s=stats();return header()+`<div class="hero"><div class="muted" style="color:#9ca3af">TOPIK 3 · 今日学习</div><h1>今天学 ${DB.settings.daily} 个</h1><p>看词 → 想意思 → 点卡片看例句 → 选择认识/不认识 → 自动下一词。</p></div><div class="grid"><div class="card"><div class="muted">已掌握</div><div class="stat">${s.known}</div></div><div class="card"><div class="muted">错词</div><div class="stat">${s.wrong}</div></div></div><div class="section card"><h2>今天做什么</h2><div class="actions"><button class="btn" onclick="startNew()">开始今日新词</button><button class="btn secondary" onclick="startWrong()">复习错词</button></div></div>`}function learn(){if(!session)return header()+`<div class="card empty">点击首页开始学习。</div>`;let w=session.items[session.i];return header()+`<div class="card word-card"><div class="level">Level ${w.level} · ${session.i+1}/${session.items.length}</div><div class="word">${esc(w.word)}</div><div class="pos">${esc(w.pos||'词性')}</div><div class="meaning">${esc(w.meaning)}</div><button class="btn secondary" style="margin:8px auto" onclick="toggleExample()">${session.show?'收起例句':'查看例句'}</button>${session.show?`<div class="example"><div class="ko">${esc(w.example)}</div><div class="zh">${esc(w.example_zh)}</div></div>`:''}<div class="quiz"><button class="option" onclick="answer(false)">❌ 不认识</button><button class="option" onclick="answer(true)">✓ 认识</button></div>${session.feedback?`<div class="feedback">${session.feedback}</div>`:''}</div>`}function toggleExample(){session.show=!session.show;render()}function startNew(){let items=DATA.words.filter(w=>prog(w.id).seen===0).slice(0,DB.settings.daily);if(!items.length){alert('今天的新词完成了！');return}session={items,i:0,show:false,feedback:''};view='learn';render()}function startWrong(){let items=DATA.words.filter(w=>prog(w.id).wrong>0).slice(0,20);if(!items.length){alert('还没有错词。');return}session={items,i:0,show:false,feedback:''};view='learn';render()}function answer(ok){if(!session||session.lock)return;session.lock=true;let w=session.items[session.i];touch(w,ok);session.feedback=ok?'✓ 已记录':'✗ 已加入错词复习';render();setTimeout(()=>{if(session.i<session.items.length-1){session.i++;session.lock=false;session.show=false;session.feedback='';render()}else{session=null;view='home';render()}},220)}function review(){return header()+`<div class="card"><h2>错词本</h2><p class="muted">答错的词会自动出现在这里。</p><button class="btn" onclick="startWrong()">开始复习</button></div>`}function library(){let a=words();return header()+`<div class="card"><input class="search" placeholder="搜索韩语 / 中文" oninput="search(this.value)"><div class="tabs">${['all','1','2','3','4','5','6'].map(l=>`<button class="tab ${level===l?'active':''}" onclick="level='${l}';render()">${l==='all'?'全部':'Level '+l}</button>`).join('')}</div></div><div id="results" class="section list">${a.slice(0,100).map(row).join('')}</div>`}function search(q){q=q.toLowerCase();let a=words().filter(w=>w.word.toLowerCase().includes(q)||w.meaning.includes(q));$('#results').innerHTML=a.slice(0,100).map(row).join('')||'<div class="empty">没有找到。</div>'}function row(w){return `<div class="row"><div><div class="w">${esc(w.word)}</div><div class="muted">${esc(w.pos||'')} · Level ${w.level}</div></div><div class="m">${esc(w.meaning)}<br>${esc(w.example||'')}</div></div>`}function nav(){return `<div class="nav">${[['home','首页'],['learn','学习'],['review','错词'],['library','词库'],['home','我的']].map(([v,t])=>`<button class="${view===v?'active':''}" onclick="view='${v}';render()">${t}</button>`).join('')}</div>`}async function init(){load();DATA=await fetch('level1.json').then(r=>r.json());render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}init();</script></body></html>
