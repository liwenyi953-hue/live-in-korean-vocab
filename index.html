<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Live in｜韩语单词 1V1</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--soft:#eef2ff;--danger:#b91c1c;--ok:#166534}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Noto Sans CJK SC",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:900px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.hero{background:#111827;color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.hero h1{font-size:30px;line-height:1.15;margin:0 0 8px}.hero p{margin:0;color:#d1d5db;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px}.stat{font-size:27px;font-weight:900}.muted{color:var(--muted);font-size:12px}.progress{height:8px;background:#edf0f3;border-radius:99px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:#111827;border-radius:99px}.nav{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);width:min(860px,calc(100% - 20px));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 12px 40px rgba(0,0,0,.12)}.nav button{background:transparent;padding:9px 4px;border-radius:14px;color:var(--muted);font-size:11px}.nav button.active{background:#111827;color:#fff}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#111827;color:#fff;padding:11px 15px;border-radius:13px;font-weight:750}.btn.secondary{background:#fff;color:#111827;border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.word-card{min-height:370px;display:flex;flex-direction:column;justify-content:center;text-align:center}.level{font-size:12px;color:var(--muted);margin-bottom:12px}.word{font-size:46px;font-weight:900;letter-spacing:-1px}.meaning{font-size:20px;margin:12px auto;max-width:680px}.raw{font-size:12px;color:var(--muted);line-height:1.5;max-width:700px;margin:8px auto}.quiz{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.option{padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left}.option:hover{border-color:#9ca3af}.feedback{margin-top:14px;padding:12px;border-radius:14px;background:#f3f4f6}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:15px}.row .w{font-weight:850}.row .m{font-size:13px;color:var(--muted);text-align:right}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none;margin-bottom:10px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.tab{white-space:nowrap;padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:999px}.tab.active{background:#111827;color:#fff}.notice{padding:12px 14px;border-radius:15px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.5}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:600px){.app{padding:14px 12px 105px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:26px}.word{font-size:40px}.quiz{grid-template-columns:1fr}.card{padding:14px}.nav{bottom:8px}.nav button{font-size:10px}}
</style></head><body><div id="app"></div><script>
const APP={};let DB=null,DATA=null,view='home',level='all',session=null,quizMode=false;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);const daysBetween=(a,b)=>Math.floor((new Date(b)-new Date(a))/86400000);
function loadState(){try{DB=JSON.parse(localStorage.getItem('livein_state')||'{}')}catch{DB={}}DB.progress??={};DB.streak??={last:null,count:0};DB.settings??={daily:10,reminder:'20:00'};DB.started??=today();}
function save(){localStorage.setItem('livein_state',JSON.stringify(DB))}
function words(){let w=DATA.words;return level==='all'?w:w.filter(x=>x.level===level)}
function prog(id){return DB.progress[id]??{seen:0,correct:0,wrong:0,mastery:0,next:null,last:null}}
function due(w){let p=prog(w.id);return !p.next||p.next<=today()}
function nextDate(days){let d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function touch(w,ok){let p=prog(w.id);p.seen++;p.last=today();if(ok){p.correct++;p.mastery=Math.min(5,p.mastery+1);p.next=nextDate([0,1,3,7,14,30][p.mastery]);}else{p.wrong++;p.mastery=Math.max(0,p.mastery-1);p.next=today()}DB.progress[w.id]=p;updateStreak();save()}
function updateStreak(){let s=DB.streak;if(s.last===today())return;if(s.last&&daysBetween(s.last,today())===1)s.count++;else s.count=1;s.last=today()}
function stats(){let w=DATA.words;let known=w.filter(x=>prog(x.id).mastery>=4).length;let wrong=w.filter(x=>prog(x.id).wrong>0).length;let dueN=w.filter(due).length;return {total:w.length,known,wrong,due:dueN,rate:w.length?Math.round(known/w.length*100):0}}
function dailyNew(){let used=DATA.words.filter(w=>prog(w.id).seen>0).length;let arr=words().filter(w=>prog(w.id).seen===0);return arr.slice(0,DB.settings.daily)}
function dueList(){return words().filter(due).sort((a,b)=>(prog(a.id).mastery-prog(b.id).mastery)).slice(0,20)}
function render(){if(!DATA)return;let st=stats();let html='';if(view==='home')html=home(st);if(view==='learn')html=learn();if(view==='review')html=review();if(view==='library')html=library();if(view==='stats')html=statsPage(st);$('#app').innerHTML=html+nav();bind();}
function header(){return `<div class="top"><div class="brand">Live in｜韩语单词 1V1<small>你的长期韩语词汇记忆本</small></div><button class="pill" onclick="sourceInfo()">词库说明</button></div>`}
function home(st){let days=Math.max(0,Math.ceil((new Date('2026-11-28')-new Date())/86400000));let newN=dailyNew().length;return header()+`<div class="hero"><div class="muted" style="color:#9ca3af">TOPIK 3 · 倒计时</div><h1>${days} 天</h1><p>今天只做一小块：${newN} 个新词 + 到期复习。先开始，不追求一次背完。</p></div><div class="grid"><div class="card"><div class="muted">已掌握</div><div class="stat">${st.known}</div><div class="progress"><i style="width:${st.rate}%"></i></div></div><div class="card"><div class="muted">待复习</div><div class="stat">${st.due}</div><div class="muted">错词 ${st.wrong}</div></div><div class="card"><div class="muted">连续学习</div><div class="stat">${DB.streak.count} 天</div></div><div class="card"><div class="muted">词库</div><div class="stat">${st.total}</div><div class="muted">来源书籍 OCR 索引</div></div></div><div class="section"><div class="card"><h2>今天做什么</h2><div class="actions"><button class="btn" onclick="startNew()">开始今日新词</button><button class="btn secondary" onclick="startReview()">复习 ${Math.min(st.due,20)} 个</button></div></div></div><div class="section"><div class="card"><h2>学习等级</h2>${['1','2','3','4','5','6'].map(l=>{let a=DATA.words.filter(w=>w.level===l),k=a.filter(w=>prog(w.id).mastery>=4).length;return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>Level ${l}</b><span class="muted">${k}/${a.length}</span></div><div class="progress"><i style="width:${a.length?k/a.length*100:0}%"></i></div></div>`}).join('')}</div></div>`}
function learn(){if(!session)return header()+`<div class="card empty">选择“开始今日新词”或在这里开始。</div>`;let w=session.items[session.i];let p=prog(w.id);return header()+`<div class="card word-card"><div class="level">Level ${w.level} · ${session.i+1}/${session.items.length} · 熟练度 ${p.mastery}/5</div><div class="word">${esc(w.word)}</div>${w.meaning?`<div class="meaning">${esc(w.meaning)}</div>`:`<div class="meaning">原书释义</div><div class="raw">OCR 未能可靠识别中文释义，请点“查看原书”核对。</div>`}<div class="actions" style="justify-content:center;margin-top:12px"><button class="btn secondary" onclick="openBook(${w.page})">查看原书</button></div><div class="quiz">${makeOptions(w).map((o,j)=>`<button class="option" onclick="answer(${j})">${esc(o)}</button>`).join('')}</div>${session.feedback?`<div class="feedback">${esc(session.feedback)}</div>`:''}</div>`}
function makeOptions(w){let m=w.meaning||'我认识这个词';let pool=DATA.words.filter(x=>x.id!==w.id&&x.meaning).map(x=>x.meaning);pool=pool.sort(()=>Math.random()-.5).slice(0,3);return [...pool,m].sort(()=>Math.random()-.5)}
function answer(j){let w=session.items[session.i];let opts=[...document.querySelectorAll('.option')].map(x=>x.textContent);let ok=opts[j]===(w.meaning||'我认识这个词');touch(w,ok);session.feedback=ok?'✓ 记住了，下一次会拉长复习间隔。':'✗ 这个词会进入错词/高频复习。';render();setTimeout(()=>{if(session&&session.i<session.items.length-1){session.i++;session.feedback='';render()}else{session=null;view='home';render()}},650)}
function startNew(){let items=dailyNew();if(!items.length){alert('今天的新词已经完成了！去复习到期词吧。');return}session={items,i:0,feedback:''};view='learn';render()}
function startReview(){let items=dueList();if(!items.length){alert('现在没有到期复习词。');return}session={items,i:0,feedback:''};view='learn';render()}
function review(){let bad=words().filter(w=>prog(w.id).wrong>0).sort((a,b)=>prog(b.id).wrong-prog(a.id).wrong);return header()+`<div class="card"><h2>错词本</h2><div class="muted" style="margin-bottom:12px">答错一次就会更快回来。连续答对后才逐渐拉长间隔。</div><div class="actions"><button class="btn" onclick="startWrong()">开始错词复习</button></div></div><div class="section list">${bad.slice(0,50).map(w=>row(w)).join('')||`<div class="empty">还没有错词。先做几道题。</div>`}</div>`}
function startWrong(){let items=words().filter(w=>prog(w.id).wrong>0).sort((a,b)=>prog(b.id).wrong-prog(a.id).wrong).slice(0,20);if(!items.length)return;session={items,i:0,feedback:''};view='learn';render()}
function row(w){let p=prog(w.id);return `<div class="row"><div><div class="w">${esc(w.word)}</div><div class="muted">Level ${w.level} · ${p.mastery}/5 · 错 ${p.wrong}</div></div><div class="m">${esc(w.meaning||'原书释义')}<br><button class="pill" onclick="openBook(${w.page})">原书</button></div></div>`}
function library(){return header()+`<div class="card"><input class="search" id="search" placeholder="搜索韩语单词 / 中文释义" oninput="searchWords()"><div class="tabs">${['all','1','2','3','4','5','6'].map(l=>`<button class="tab ${level===l?'active':''}" onclick="setLevel('${l}')">${l==='all'?'全部':'Level '+l}</button>`).join('')}</div></div><div id="results" class="section list">${words().slice(0,80).map(row).join('')}</div>`}
function searchWords(){let q=$('#search').value.trim().toLowerCase();let arr=words().filter(w=>!q||w.word.toLowerCase().includes(q)||w.meaning.includes(q)).slice(0,100);$('#results').innerHTML=arr.map(row).join('')||`<div class="empty">没有找到。</div>`}
function setLevel(l){level=l;render()}
function statsPage(st){let mastered=DATA.words.filter(w=>prog(w.id).mastery>=4);return header()+`<div class="grid"><div class="card"><div class="muted">总词数</div><div class="stat">${st.total}</div></div><div class="card"><div class="muted">掌握率</div><div class="stat">${st.rate}%</div></div></div><div class="section card"><h2>数据管理</h2><div class="actions"><button class="btn secondary" onclick="exportData()">导出学习记录</button><button class="btn secondary" onclick="importData()">导入学习记录</button><button class="btn secondary" onclick="askNotify()">开启提醒</button><button class="btn danger" onclick="resetProgress()">清空学习记录</button></div></div><div class="section card"><h2>每日任务</h2><div class="actions">${[5,10,15,20].map(n=>`<button class="tab ${DB.settings.daily===n?'active':''}" onclick="setDaily(${n})">${n}个新词</button>`).join('')}</div><div class="muted" style="margin-top:10px">建议先保持 10 个，稳定比一次背很多更重要。</div></div><div class="section card"><h2>提醒时间</h2><input id="reminder" type="time" value="${DB.settings.reminder}" onchange="DB.settings.reminder=this.value;save()" style="padding:10px;border:1px solid var(--line);border-radius:10px"></div><div class="section card"><h2>已掌握示例</h2><div class="list">${mastered.slice(0,10).map(row).join('')}</div></div>`}
function nav(){return `<div class="nav">${[['home','首页'],['learn','学习'],['review','错词'],['library','词库'],['stats','我的']].map(([v,t])=>`<button class="${view===v?'active':''}" onclick="view='${v}';render()">${t}</button>`).join('')}</div>`}
function openBook(p){alert('原书PDF没有公开放到网站中。请用你保存的原书PDF核对第 '+p+' 页。')}
function sourceInfo(){alert('词库来自你上传的《完全掌握新韩国语能力考试TOPIK必备单词》PDF。书中核心词汇分为初级/中级/高级各约1000词；本 App 将三段映射为 Level 1–6。当前索引以 OCR 为基础，因此部分中文释义可能无法可靠识别；遇到空白释义可直接打开对应原书页核对。')}
function setDaily(n){DB.settings.daily=n;save();render()}
function resetProgress(){if(confirm('确定清空所有学习记录吗？')){DB.progress={};DB.streak={last:null,count:0};save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='livein-study-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();render()}catch{alert('文件格式不正确。')}};r.readAsText(f)};i.click()}
async function askNotify(){if(!('Notification'in window)){alert('当前浏览器不支持通知。');return}let p=await Notification.requestPermission();alert(p==='granted'?'提醒权限已开启。':'没有开启提醒权限。')}
async function init(){loadState();let r=await fetch('level1.json');DATA=await r.json();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();
</script></body></html>
