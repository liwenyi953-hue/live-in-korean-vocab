<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Live in｜韩语单词 1V1</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#15803d;--bad:#dc2626;--gold:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Noto Sans CJK SC",sans-serif}.app{max-width:900px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{font-weight:900;font-size:21px}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.hero{background:#111827;color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.hero h1{font-size:30px;line-height:1.15;margin:0 0 8px}.hero p{margin:0;color:#d1d5db;font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{font-size:27px;font-weight:900}.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#111827;color:#fff;padding:12px 16px;border-radius:13px;font-weight:750}.btn.secondary{background:#fff;color:#111827;border:1px solid var(--line)}.map{display:grid;gap:10px}.stage{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:17px}.stage.lock{opacity:.48}.stage.current{border:2px solid #111827}.bubble{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#111827;color:#fff;font-weight:900}.lock .bubble{background:#d1d5db}.stage strong{display:block}.stage span{font-size:12px;color:var(--muted)}.word-card{text-align:center;min-height:430px;display:flex;flex-direction:column;justify-content:center}.phase{font-size:12px;color:var(--muted);margin-bottom:9px}.word{font-size:46px;font-weight:900}.pos{display:inline-block;margin:9px auto 3px;padding:6px 10px;border-radius:999px;background:#f3f4f6;font-size:12px;color:#4b5563}.meaning{font-size:20px;margin:8px auto}.example{margin:12px auto;padding:14px 16px;background:#f8fafc;border:1px solid var(--line);border-radius:15px;max-width:700px;text-align:left}.ko{font-size:17px;font-weight:750;line-height:1.6}.zh{font-size:13px;color:var(--muted);margin-top:5px}.quiz{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.option{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left;font-weight:650}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fecaca;background:#fef2f2}.listen{font-size:38px;width:82px;height:82px;border-radius:50%;background:#111827;color:#fff;margin:12px auto}.input{width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;font-size:20px;text-align:center;outline:none}.feedback{margin-top:12px;padding:11px;border-radius:14px;font-weight:750}.ok{background:#f0fdf4;color:var(--ok)}.bad{background:#fef2f2;color:var(--bad)}.progress{height:9px;background:#edf0f3;border-radius:99px;overflow:hidden;margin:9px 0 16px}.progress i{display:block;height:100%;background:#111827}.result{text-align:center;padding:30px 15px}.stars{font-size:32px;letter-spacing:4px}.nav{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);width:min(860px,calc(100% - 20px));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 12px 40px rgba(0,0,0,.12)}.nav button{background:transparent;padding:9px 4px;border-radius:14px;color:var(--muted);font-size:11px}.nav button.active{background:#111827;color:#fff}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:15px}.row .w{font-weight:850}.row .m{font-size:13px;color:var(--muted);text-align:right}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}.tabs{display:flex;gap:7px;overflow:auto;margin-top:10px}.tab{white-space:nowrap;padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:999px}.tab.active{background:#111827;color:#fff}@media(max-width:600px){.app{padding:14px 12px 105px}.word{font-size:40px}.quiz{grid-template-columns:1fr}.nav{bottom:8px}}
</style></head><body><div id="app"></div><script>
let DATA,DB,view='home',session=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function load(){try{DB=JSON.parse(localStorage.getItem('livein_state')||'{}')}catch{DB={}}DB.levels??={};DB.progress??={};DB.streak??=0;save()}function save(){localStorage.setItem('livein_state',JSON.stringify(DB))}function p(id){return DB.progress[id]??{seen:0,correct:0,wrong:0}}function groups(){let a=DATA.words;let out=[];for(let i=0;i<a.length;i+=10)out.push(a.slice(i,i+10));return out}function done(n){return !!DB.levels[n]?.passed}function header(){return `<div class="top"><div class="brand">Live in｜韩语单词 1V1<small>游戏化韩语词汇闯关</small></div><button class="pill" onclick="view='home';render()">我的</button></div>`}
function home(){let gs=groups(),unlocked=0;for(let i=0;i<gs.length;i++){if(i===0||done(i-1))unlocked=i+1;else break}return header()+`<div class="hero"><div style="color:#9ca3af;font-size:12px">TOPIK 韩语词汇</div><h1>一关一关学，像玩游戏一样</h1><p>每关10个单词：先学习，再完成40题。每个单词固定出现4次，从音、意、形、例句四个角度加深记忆。</p></div><div class="card"><h2>🗺️ 闯关地图</h2><div class="map">${gs.map((g,i)=>{let open=i<unlocked,pass=done(i);return `<div class="stage ${!open?'lock':''} ${open&&!pass?'current':''}" onclick="${open?`startLevel(${i})`:''}"><div class="bubble">${pass?'✓':i+1}</div><div><strong>第 ${i+1} 关</strong><span>${g[0].word} ～ ${g[g.length-1].word} · ${g.length}个单词${pass?' · 已完成':open?' · 可以挑战':' · 🔒 未解锁'}</span></div></div>`}).join('')}</div></div>`}
function learnScreen(){let w=session.items[session.i];return header()+`<div class="card"><div class="phase">学习阶段 · ${session.i+1}/10</div><div class="progress"><i style="width:${(session.i/10)*100}%"></i></div><div class="word-card"><div class="word">${esc(w.word)}</div><div class="pos">${esc(w.pos||'词性')}</div><div class="meaning">${esc(w.meaning)}</div><div class="example"><div class="ko">${esc(w.example||'')}</div><div class="zh">${esc(w.example_zh||'')}</div></div><div class="actions" style="justify-content:center;margin-top:10px"><button class="btn danger" onclick="learnAnswer(false)">❌ 不认识</button><button class="btn" onclick="learnAnswer(true)">✓ 认识</button></div></div></div>`}
function learnAnswer(ok){if(session.lock)return;session.lock=true;let w=session.items[session.i];let x=p(w.id);x.seen++;ok?x.correct++:x.wrong++;DB.progress[w.id]=x;save();setTimeout(()=>{if(session.i<9){session.i++;session.lock=false;render()}else{session.phase='quiz';session.q=0;session.correct=0;session.lock=false;render()}},180)}
function makeQs(items){let qs=[];items.forEach((w,i)=>{let others=items.filter(x=>x.id!==w.id);let pick=()=>shuffle([w,...shuffle(others).slice(0,3)]);qs.push({type:'listen',w,opts:pick()});qs.push({type:'meaning',w,opts:pick()});qs.push({type:'write',w});let sentence=w.example||`${w.word}을 공부합니다.`;let blank=sentence.replace(w.word,'____');qs.push({type:'sentence',w,opts:pick().map(x=>({text:(x.example||'').replace(x.word,'____'),word:x.word})),sentence:blank});});return qs}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function quizScreen(){let q=session.questions[session.q],total=session.questions.length;let title={listen:'🔊 听读音选词汇',meaning:'🇨🇳 看翻译选韩语',write:'✍️ 看意思写韩语',sentence:'🧩 例句填空'}[q.type];let body='';if(q.type==='listen')body=`<div class="meaning">听读音，选择你听到的单词</div><button class="listen" onclick="speak('${esc(q.w.word)}')">🔊</button><div class="quiz">${q.opts.map(o=>`<button class="option" onclick="choose('${o.id}','${q.w.id}')">${esc(o.word)}</button>`).join('')}</div>`;if(q.type==='meaning')body=`<div class="word" style="font-size:30px">${esc(q.w.meaning)}</div><div class="meaning">选择对应的韩语单词</div><div class="quiz">${q.opts.map(o=>`<button class="option" onclick="choose('${o.id}','${q.w.id}')">${esc(o.word)}</button>`).join('')}</div>`;if(q.type==='write')body=`<div class="meaning">请写出：<strong>${esc(q.w.meaning)}</strong></div><input id="answer" class="input" autocomplete="off" autocapitalize="off" placeholder="输入韩语" onkeydown="if(event.key==='Enter')checkWrite()"><button class="btn" style="margin-top:12px" onclick="checkWrite()">提交</button>`;if(q.type==='sentence')body=`<div class="word" style="font-size:30px">${esc(q.w.word)}</div><div class="example"><div class="ko">${esc(q.sentence)}</div><div class="zh">选择最自然的完整句子</div></div><div class="quiz">${q.opts.map(o=>`<button class="option" onclick="chooseSentence('${esc(o.text)}','${q.w.id}')">${esc(o.text)}</button>`).join('')}</div>`;return header()+`<div class="card"><div class="phase">第 ${session.level+1} 关 · 闯关阶段 · ${session.q+1}/${total}</div><div class="progress"><i style="width:${(session.q/total)*100}%"></i></div><h2>${title}</h2>${body}${session.feedback?`<div class="feedback ${session.feedback.ok?'ok':'bad'}">${session.feedback.text}</div>`:''}</div>`}
function choose(id,correct){if(session.lock)return;session.lock=true;let ok=id===correct;if(ok)session.correct++;session.feedback={ok,text:ok?'✓ 正确！':'✗ 再看一下，正确答案是 '+session.items.find(x=>x.id===correct).word};render();setTimeout(nextQ,500)}function chooseSentence(text,correct){let q=session.questions[session.q],ok=text===q.opts.find(o=>o.id===correct)?.text;if(ok)session.correct++;session.lock=true;session.feedback={ok,text:ok?'✓ 句子正确！':'✗ 正确句子：'+q.w.example};render();setTimeout(nextQ,500)}function checkWrite(){if(session.lock)return;let q=session.questions[session.q],v=$('#answer').value.trim();if(!v)return;let ok=v===q.w.word;if(ok)session.correct++;session.lock=true;session.feedback={ok,text:ok?'✓ 拼写正确！':'✗ 正确答案：'+q.w.word};render();setTimeout(nextQ,600)}function nextQ(){if(session.q<39){session.q++;session.lock=false;session.feedback=null;render()}else{let pass=session.correct>=32;DB.levels[session.level]={passed:pass,score:session.correct,finished:Date.now()};save();session={phase:'result',pass};render()}}function result(){return header()+`<div class="card result"><div style="font-size:52px">${session.pass?'🎉':'💪'}</div><h1>${session.pass?'第 '+(session.level+1)+' 关通过！':'再挑战一次'}</h1><div class="stars">${session.pass?'⭐⭐⭐':'⭐'}</div><p>40题完成 · ${session.correct||DB.levels[session.level]?.score||0}/40 答对</p><p class="muted">每个单词都出现了4次：读音、词义、拼写、例句。</p><div class="actions" style="justify-content:center"><button class="btn" onclick="${session.pass?`view='home';session=null;render()`: `startLevel(${session.level})`}">${session.pass?'继续下一关':'重新挑战'}</button></div></div>`}
function startLevel(n){let items=groups()[n];session={level:n,items,i:0,phase:'learn',questions:[],q:0,correct:0,feedback:null};render()}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.82;speechSynthesis.speak(u)}function review(){let bad=DATA.words.filter(w=>p(w.id).wrong>0);return header()+`<div class="card"><h2>错题复习</h2><p class="muted">这里会收集闯关时答错过的单词。</p>${bad.length?bad.map(w=>`<div class="row"><div><div class="w">${esc(w.word)}</div><div class="muted">${esc(w.pos||'')}</div></div><div class="m">${esc(w.meaning)}</div></div>`).join(''):'<p class="muted">还没有错题。</p>'}</div>`}function library(){return header()+`<div class="card"><h2>词库</h2><p class="muted">当前测试词库：${DATA.words.length} 个。后续可继续接入完整词库。</p>${DATA.words.slice(0,100).map(w=>`<div class="row"><div><div class="w">${esc(w.word)}</div><div class="muted">${esc(w.pos||'')}</div></div><div class="m">${esc(w.meaning)}</div></div>`).join('')}</div>`}function nav(){return `<div class="nav"><button class="${view==='home'?'active':''}" onclick="view='home';session=null;render()">🗺️ 闯关</button><button class="${view==='review'?'active':''}" onclick="view='review';session=null;render()">🔁 错题</button><button class="${view==='library'?'active':''}" onclick="view='library';session=null;render()">📚 词库</button><button onclick="alert('Live in｜韩语单词 1V1')">👤 我的</button></div>`}function render(){let h;if(session){if(session.phase==='learn')h=learnScreen();else if(session.phase==='quiz'){if(!session.questions.length)session.questions=makeQs(session.items);h=quizScreen()}else h=result()}else h=view==='home'?home():view==='review'?review():library();$('#app').innerHTML=h+nav()}async function init(){load();DATA=await fetch('level1.json').then(r=>r.json());render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}init();</script></body></html>
